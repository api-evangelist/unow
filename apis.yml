name: uNow (UniversityNow)
description: UniversityNow, Inc. (uNow) was a San Francisco-based higher-education
  startup founded in 2011 and backed by 500 Startups (500 Global) that built competency-based,
  self-paced online degree programs for working adults. It operated New Charter University,
  acquired Patten University in 2012, and its learning platform was sold to Penn Foster
  Education Group in 2016 and National University System in 2018. The company is defunct
  and unow.com now redirects to a dead page; it published no public API.
